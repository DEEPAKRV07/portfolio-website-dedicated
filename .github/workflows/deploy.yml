name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build artifact integrity
        run: |
          echo "=== DIST CONTENTS ==="
          find dist -maxdepth 3 -type f | sort
          echo "=== DIST INDEX ==="
          cat dist/index.html
          echo "=== VERIFY REQUIRED FILES ==="
          test -f dist/index.html || (echo "Error: dist/index.html missing" && exit 1)
          test -d dist/assets || (echo "Error: dist/assets missing" && exit 1)
          test -f dist/.nojekyll || (echo "Error: dist/.nojekyll missing" && exit 1)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
